# Secrets and configuration example.
# Shows how to create ConfigMaps and Secrets, then consume them in the Deployment
# as environment variables or mounted files.
#
# Usage:
#   helm install my-app oci://ghcr.io/sondn98/unichart/generic -f secrets-and-config.yaml

applicationName: my-app

# --- ConfigMap ---
configMap:
  enabled: true
  files:
    app-config:
      LOG_LEVEL: info
      SERVER_PORT: "8080"
      FEATURE_X_ENABLED: "true"

# --- Secret (chart base64-encodes the values automatically) ---
secret:
  enabled: true
  files:
    db-credentials:
      data:
        DB_HOST: postgres.default.svc.cluster.local
        DB_USER: myapp
        DB_PASSWORD: supersecret
    api-keys:
      stringData:
        THIRD_PARTY_API_KEY: raw-key-value

# --- Deployment: consume the ConfigMap and Secret ---
deployment:
  image:
    repository: docker.io/myorg/my-app
    tag: "1.0.0"

  # Mount all keys from the ConfigMap as env vars
  envFrom:
    app-config:
      type: configmap
      nameSuffix: app-config

  # Mount individual Secret keys as env vars
  env:
    DB_HOST:
      valueFrom:
        secretKeyRef:
          name: my-app-db-credentials
          key: DB_HOST
    DB_USER:
      valueFrom:
        secretKeyRef:
          name: my-app-db-credentials
          key: DB_USER
    DB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: my-app-db-credentials
          key: DB_PASSWORD

service:
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
