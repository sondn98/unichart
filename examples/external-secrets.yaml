# External Secrets example — pull secrets from an external provider (e.g. HashiCorp Vault)
# using the External Secrets Operator.
#
# Prerequisites:
#   - External Secrets Operator installed: https://external-secrets.io
#   - A SecretStore or ClusterSecretStore configured pointing to your provider
#
# Usage:
#   helm install my-app oci://ghcr.io/sondn98/unichart/generic -f external-secrets.yaml

applicationName: my-app

deployment:
  image:
    repository: docker.io/myorg/my-app
    tag: "1.0.0"
  env:
    DB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: my-app-db-secret   # name produced by externalSecret below
          key: db-password

service:
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080

# --- ExternalSecret: fetch secrets from Vault ---
externalSecret:
  enabled: true
  # Default SecretStore used by all entries unless overridden per entry
  secretStore:
    name: vault-secret-store
    kind: ClusterSecretStore
  refreshInterval: "5m"
  files:
    # Creates a Kubernetes Secret named "my-app-db-secret"
    db-secret:
      data:
        db-password:
          remoteRef:
            key: secret/myapp/database   # path in Vault
            property: password           # field inside the secret
        db-username:
          remoteRef:
            key: secret/myapp/database
            property: username
    # Fetch all keys under a Vault path at once
    app-config:
      dataFrom:
        key: secret/myapp/config
