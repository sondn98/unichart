# Web application example — Deployment + Ingress + HPA + liveness/readiness probes.
#
# Prerequisites:
#   - An Ingress controller installed (e.g. ingress-nginx)
#   - Metrics Server installed (required for HPA CPU/memory metrics)
#
# Usage:
#   helm install my-app oci://ghcr.io/sondn98/unichart/generic -f web-app.yaml

applicationName: my-app

deployment:
  image:
    repository: docker.io/myorg/my-app
    tag: "1.0.0"

  ports:
    - containerPort: 8080
      name: http
      protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  readinessProbe:
    enabled: true
    httpGet:
      path: /health/ready
      port: 8080
    periodSeconds: 10
    failureThreshold: 3

  livenessProbe:
    enabled: true
    httpGet:
      path: /health/live
      port: 8080
    periodSeconds: 30
    failureThreshold: 3

  # Graceful shutdown: wait for in-flight requests to finish
  lifecycle:
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 5"]
  terminationGracePeriodSeconds: 30

service:
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: my-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: my-app-tls
      hosts:
        - my-app.example.com

# Horizontal Pod Autoscaler — scale between 2 and 10 replicas
# Leave deployment.replicas unset so HPA controls the replica count.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

pdb:
  enabled: true
  minAvailable: 1
